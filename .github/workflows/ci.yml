name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a Terraform release can never change the normalised output
  # the golden tests and live tests assert against unannounced.
  TERRAFORM_VERSION: 1.16.5
  # Embedded checks only (--skip-check-update), so the trivy version alone
  # decides which misconfigurations the security-scan layer reports.
  TRIVY_VERSION: v0.75.0

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      # The wrapper rewrites stdout and exit codes for workflow outputs,
      # which would corrupt the JSON stricttf parses from terraform.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Pinned by commit: a moved tag on a security tool's installer is the
      # supply-chain attack this step would otherwise be open to.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # STRICTTF_REQUIRE_TERRAFORM turns a skipped live test into a
      # failure, so the end-to-end layer can never silently stop being
      # tested.
      - name: Run tests
        env:
          STRICTTF_REQUIRE_TERRAFORM: "1"
          STRICTTF_REQUIRE_TRIVY: "1"
          PROPTEST_CASES: 512
        run: cargo test --all-targets --all-features --locked

      - name: Verify a package-less git install
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/git-install"
          cargo install --git "file://$GITHUB_WORKSPACE" --root "$install_root" --locked
          test -x "$install_root/bin/stricttf"
          "$install_root/bin/stricttf" --help > /dev/null

      - name: Verify agent skill installation
        shell: bash
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/git-install/bin/stricttf"
          agent_home="$RUNNER_TEMP/agent-home"
          mkdir -p "$agent_home/.codex" "$agent_home/.claude"

          HOME="$agent_home" "$binary" install-skills > "$RUNNER_TEMP/skills.json"
          grep -q '"ok": true' "$RUNNER_TEMP/skills.json"
          cmp skills/stricttf/SKILL.md "$agent_home/.agents/skills/stricttf/SKILL.md"
          cmp skills/stricttf/SKILL.md "$agent_home/.claude/skills/stricttf/SKILL.md"

          # Idempotent on a second run.
          HOME="$agent_home" "$binary" install-skills > "$RUNNER_TEMP/skills-again.json"
          grep -q '"ok": true' "$RUNNER_TEMP/skills-again.json"

  strictrs:
    name: strictrs subset
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Install strictrs
        run: cargo install --git https://github.com/ilvar/strictrs --locked

      # stricttf is itself written in the strictrs strict subset. Its own
      # gate is the same kind of gate it imposes on the modules it checks.
      - name: strictrs check
        shell: bash
        run: |
          set -euo pipefail
          strictrs check . > strictrs-report.json || status=$?
          cat strictrs-report.json
          exit "${status:-0}"

      - name: Upload strictrs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strictrs-report
          path: strictrs-report.json

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Pinned by commit: a moved tag on a security tool's installer is the
      # supply-chain attack this step would otherwise be open to.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Measure coverage
        env:
          STRICTTF_REQUIRE_TERRAFORM: "1"
          STRICTTF_REQUIRE_TRIVY: "1"
        run: |
          cargo llvm-cov --all-features --locked \
            --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage.txt

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage.txt

      # A coverage number nobody enforces is a number nobody reads.
      - name: Enforce the line-coverage floor
        run: cargo llvm-cov report --fail-under-lines 94

  module:
    name: generated module
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Pinned by commit: a moved tag on a security tool's installer is the
      # supply-chain attack this step would otherwise be open to.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Install stricttf
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/stricttf-install"
          cargo install --path . --root "$install_root" --locked
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Generate a module
        shell: bash
        run: |
          set -euo pipefail
          module_root="$(mktemp -d)"
          cd "$module_root"
          stricttf new demo-module > report.json
          grep -q '"ok": true' report.json
          echo "GENERATED_MODULE=$module_root/demo-module" >> "$GITHUB_ENV"

      # Runs before the gate, which legitimately creates .terraform.
      - name: Assert a full check leaves the module untouched
        working-directory: ${{ env.GENERATED_MODULE }}
        shell: bash
        run: |
          set -euo pipefail
          git init -q .
          git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm generated
          stricttf check . > "$RUNNER_TEMP/report.json"
          grep -q '"ok": true' "$RUNNER_TEMP/report.json"
          git status --porcelain --ignored
          test -z "$(git status --porcelain --ignored)"

      # The generated module's own gate, run exactly as a contributor would.
      - name: Run the generated module's gate
        working-directory: ${{ env.GENERATED_MODULE }}
        run: ./scripts/check.sh

      - name: Upload the generated module
        if: always() && env.GENERATED_MODULE != ''
        uses: actions/upload-artifact@v7
        with:
          name: generated-module
          path: ${{ env.GENERATED_MODULE }}

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_installer.py
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: shellcheck --norc --shell=bash --enable=all install.sh
  build:
    needs: [test, strictrs, coverage, module, installer]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Native build toolchain
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --yes musl-tools
          fi
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 "$TARGET"
      - name: Build and smoke test native binary
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            CC=musl-gcc CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc cargo build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
          "target/$TARGET/release/stricttf" --help >/dev/null
          if [ "$RUNNER_OS" = Linux ]; then
            readelf -l "target/$TARGET/release/stricttf" >"$RUNNER_TEMP/program-headers.txt"
            if grep -q INTERP "$RUNNER_TEMP/program-headers.txt"; then
              echo 'expected a static binary without a dynamic interpreter' >&2
              exit 1
            fi
          fi
      - name: Package with checksum
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/stricttf" "dist/stricttf-$TARGET"
          cd dist
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "stricttf-$TARGET" >"stricttf-$TARGET.sha256"
          else
            sha256sum "stricttf-$TARGET" >"stricttf-$TARGET.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stricttf-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: stricttf-*
          path: dist
          merge-multiple: true
      - name: Publish new manifest version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its binaries unchanged. Bump Cargo.toml for a new release."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_commit=$(git rev-parse "$tag^{commit}")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Unreleased tag $tag points to a different commit; bump the version instead of replacing it." >&2
              exit 1
            fi
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "stricttf $version" --generate-notes --latest
